<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdotePet - Animais para Adoção</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-badge">🐾</div>
        <div class="logo-text">Adote<span>Pet</span></div>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Início</a>
        <a href="animais.html" class="nav-link active">Animais</a>
        <a href="sobre.html" class="nav-link">Sobre</a>
      </nav>

      <div class="header-actions" id="user-nav-actions"></div>
    </div>
  </header>

  <!-- LISTAGEM COM FILTRO SIMPLES -->
  <main class="container">
    <div style="margin-bottom: 1.5rem;">
      <h1 style="font-size: 2rem; color: var(--text-main); margin-bottom: 0.5rem;">Animais Disponíveis para Adoção</h1>
      <p style="color: var(--text-muted);">Estes animais foram cadastrados no banco de dados e aguardam uma família amorosa.</p>
    </div>

    <!-- BOTÕES DE FILTRO POR ESPÉCIE -->
    <div style="margin-bottom: 1.5rem; display: flex; gap: 0.5rem;">
      <button class="btn btn-primary btn-sm" onclick="listarAnimais('todos')">Todos os Pets</button>
      <button class="btn btn-secondary btn-sm" onclick="listarAnimais('cachorro')">🐶 Somente Cães</button>
      <button class="btn btn-secondary btn-sm" onclick="listarAnimais('gato')">🐱 Somente Gatos</button>
    </div>

    <!-- ONDE OS CARDS SÃO GERADOS VIA JAVASCRIPT -->
    <div class="pets-grid" id="pets-container">
      <p>Carregando animais do MySQL...</p>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="site-footer">
    <div class="footer-copy">
      © 2026 AdotePet - Trabalho Acadêmico de Engenharia de Software.
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    // Carrega todos os animais ao abrir a página
    document.addEventListener('DOMContentLoaded', () => {
      listarAnimais('todos');
    });
  </script>
</body>
</html>
