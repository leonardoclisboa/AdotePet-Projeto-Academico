<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdotePet - Cadastro de Usuário</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body style="justify-content: center;">

  <div class="container" style="max-width: 520px; padding: 2rem 1rem;">
    <!-- CARD DO FORMULÁRIO DE CADASTRO -->
    <div class="form-card">
      <div class="form-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.25rem;">
          <div class="logo-badge">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pets</span>
          </div>
          <div class="logo-text">Adote<span>Pet</span></div>
        </a>
        <h1>Crie sua conta</h1>
        <p>Junte-se a nós para divulgar animais ou encontrar seu novo pet.</p>
      </div>

      <form id="form-cadastro-usuario">
        <!-- Campo: Nome Completo -->
        <div class="form-group">
          <label for="nome" class="form-label">
            <span>Nome completo</span>
            <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="nome" 
            name="nome" 
            class="form-control" 
            placeholder="Ex: Maria Eduarda Silva" 
            required
            autocomplete="name"
          >
        </div>

        <!-- Campo: E-mail -->
        <div class="form-group">
          <label for="email" class="form-label">
            <span>E-mail</span>
            <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="seu.email@exemplo.com" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-row">
          <!-- Campo: Senha -->
          <div class="form-group">
            <label for="senha" class="form-label">
              <span>Senha</span>
              <span class="required">*</span>
            </label>
            <input 
              type="password" 
              id="senha" 
              name="senha" 
              class="form-control" 
              placeholder="Mínimo 6 dígitos" 
              minlength="6"
              required
              autocomplete="new-password"
            >
          </div>

          <!-- Campo: Confirmação de Senha -->
          <div class="form-group">
            <label for="confirmacaoSenha" class="form-label">
              <span>Confirmar senha</span>
              <span class="required">*</span>
            </label>
            <input 
              type="password" 
              id="confirmacaoSenha" 
              name="confirmacaoSenha" 
              class="form-control" 
              placeholder="Repita sua senha" 
              minlength="6"
              required
              autocomplete="new-password"
            >
          </div>
        </div>

        <!-- Botão Cadastrar -->
        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
            <span>Finalizar Cadastro</span>
            <span class="material-symbols-outlined" style="font-size: 20px;">how_to_reg</span>
          </button>
        </div>

        <!-- Link para Login -->
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
          Já possui cadastro? <a href="login.html" style="color: var(--primary); font-weight: 600;">Faça login aqui</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      inicializarFormularioCadastroUsuario();
    });
  </script>
</body>
</html>
