<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdotePet - Cadastro de Usuário</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="justify-content: center;">

  <div class="container" style="max-width: 480px;">
    <div class="form-card">
      <div class="form-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
          <div class="logo-badge">🐾</div>
          <div class="logo-text">Adote<span>Pet</span></div>
        </a>
        <h1>Criar Conta</h1>
        <p>Cadastre-se para divulgar animais para adoção.</p>
      </div>

      <form id="form-cadastro-usuario" onsubmit="cadastrarUsuario(event)">
        <div class="form-group">
          <label for="nome" class="form-label">Nome Completo *</label>
          <input type="text" id="nome" class="form-control" placeholder="Seu nome" required>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">E-mail *</label>
          <input type="email" id="email" class="form-control" placeholder="seu.email@exemplo.com" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="senha" class="form-label">Senha *</label>
            <input type="password" id="senha" class="form-control" placeholder="Mínimo 6 dígitos" minlength="6" required>
          </div>

          <div class="form-group">
            <label for="confirmacaoSenha" class="form-label">Confirmar Senha *</label>
            <input type="password" id="confirmacaoSenha" class="form-control" placeholder="Repita a senha" minlength="6" required>
          </div>
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary" style="width: 100%;">Cadastrar</button>
        </div>

        <div style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem;">
          Já tem conta? <a href="login.html" style="color: var(--primary); font-weight: 600;">Fazer Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
