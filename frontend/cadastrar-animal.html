<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdotePet - Cadastro de Animal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-badge">🐾</div>
        <div class="logo-text">Adote<span>Pet</span></div>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Início</a>
        <a href="animais.html" class="nav-link">Animais</a>
        <a href="sobre.html" class="nav-link">Sobre</a>
      </nav>

      <div class="header-actions" id="user-nav-actions"></div>
    </div>
  </header>

  <!-- FORMULÁRIO DE CADASTRO OU EDIÇÃO -->
  <main class="container">
    <div style="margin-bottom: 1rem; text-align: center;">
      <a href="animais.html" style="color: var(--primary); font-weight: 600;">← Voltar para animais</a>
    </div>

    <div class="form-card">
      <div class="form-header">
        <h1 id="form-titulo">Cadastrar Animal para Adoção</h1>
        <p>Preencha os dados do animal para salvá-lo no banco de dados.</p>
      </div>

      <!-- Formulário com chamada direta no onsubmit -->
      <form id="form-animal" onsubmit="salvarAnimal(event)">
        <!-- Nome -->
        <div class="form-group">
          <label for="nome" class="form-label">Nome do animal *</label>
          <input type="text" id="nome" class="form-control" placeholder="Ex: Pipoca, Thor..." required>
        </div>

        <div class="form-row">
          <!-- Espécie -->
          <div class="form-group">
            <label for="especie" class="form-label">Espécie *</label>
            <select id="especie" class="form-control" required>
              <option value="">Selecione...</option>
              <option value="cachorro">Cachorro</option>
              <option value="gato">Gato</option>
            </select>
          </div>

          <!-- Porte -->
          <div class="form-group">
            <label for="porte" class="form-label">Porte *</label>
            <select id="porte" class="form-control" required>
              <option value="">Selecione...</option>
              <option value="pequeno">Pequeno</option>
              <option value="medio">Médio</option>
              <option value="grande">Grande</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <!-- Idade -->
          <div class="form-group">
            <label for="idade" class="form-label">Idade aproximada *</label>
            <input type="text" id="idade" class="form-control" placeholder="Ex: 1 ano, 4 meses..." required>
          </div>

          <!-- Foto (URL) -->
          <div class="form-group">
            <label for="foto" class="form-label">Link da Foto (URL)</label>
            <input type="url" id="foto" class="form-control" placeholder="https://link-da-foto.jpg">
          </div>
        </div>

        <!-- Descrição -->
        <div class="form-group">
          <label for="descricao" class="form-label">Descrição e Histórico *</label>
          <textarea id="descricao" class="form-control" rows="3" placeholder="Conte se é dócil, castrado ou vacinado..." required></textarea>
        </div>

        <!-- Botão Salvar -->
        <div style="margin-top: 1.5rem;">
          <button type="submit" id="btn-submit-animal" class="btn btn-primary" style="width: 100%;">
            Salvar Animal
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="site-footer">
    <div class="footer-copy">
      © 2026 AdotePet - Trabalho Acadêmico de Engenharia de Software.
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    // Se tiver "?editar=" na URL, carrega os dados no formulário
    document.addEventListener('DOMContentLoaded', checarModoEdicao);
  </script>
</body>
</html>
