<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdotePet - Entrar na sua conta</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body style="justify-content: center;">

  <div class="container" style="max-width: 480px; padding: 2rem 1rem;">
    <!-- CARD DO FORMULÁRIO DE LOGIN -->
    <div class="form-card">
      <div class="form-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1.25rem;">
          <div class="logo-badge">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pets</span>
          </div>
          <div class="logo-text">Adote<span>Pet</span></div>
        </a>
        <h1>Bem-vindo de volta!</h1>
        <p>Acesse sua conta para gerenciar e cadastrar animais.</p>
      </div>

      <form id="form-login">
        <!-- Campo: E-mail -->
        <div class="form-group">
          <label for="email" class="form-label">
            <span>E-mail</span>
            <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-control" 
            placeholder="exemplo@email.com" 
            required
            autocomplete="email"
          >
        </div>

        <!-- Campo: Senha -->
        <div class="form-group">
          <label for="senha" class="form-label">
            <span>Senha</span>
            <span class="required">*</span>
          </label>
          <input 
            type="password" 
            id="senha" 
            name="senha" 
            class="form-control" 
            placeholder="Digite sua senha" 
            required
            autocomplete="current-password"
          >
        </div>

        <!-- Botão Entrar -->
        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
            <span>Entrar no sistema</span>
            <span class="material-symbols-outlined" style="font-size: 20px;">login</span>
          </button>
        </div>

        <!-- Link para Cadastro -->
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
          Ainda não tem conta? <a href="cadastro.html" style="color: var(--primary); font-weight: 600;">Cadastre-se aqui</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      inicializarFormularioLogin();
    });
  </script>
</body>
</html>
