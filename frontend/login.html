<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdotePet - Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body style="justify-content: center;">

  <div class="container" style="max-width: 440px;">
    <div class="form-card">
      <div class="form-header">
        <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
          <div class="logo-badge">🐾</div>
          <div class="logo-text">Adote<span>Pet</span></div>
        </a>
        <h1>Entrar na Conta</h1>
        <p>Acesse o sistema para cadastrar ou gerenciar pets.</p>
      </div>

      <form id="form-login" onsubmit="loginUsuario(event)">
        <div class="form-group">
          <label for="email" class="form-label">E-mail *</label>
          <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" required>
        </div>

        <div class="form-group">
          <label for="senha" class="form-label">Senha *</label>
          <input type="password" id="senha" class="form-control" placeholder="Digite sua senha" required>
        </div>

        <div style="margin-top: 1.5rem;">
          <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
        </div>

        <div style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem;">
          Não tem conta? <a href="cadastro.html" style="color: var(--primary); font-weight: 600;">Cadastre-se</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
