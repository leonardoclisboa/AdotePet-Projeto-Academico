<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdotePet - Detalhes do Animal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-badge">🐾</div>
        <div class="logo-text">Adote<span>Pet</span></div>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Início</a>
        <a href="animais.html" class="nav-link active">Animais</a>
        <a href="sobre.html" class="nav-link">Sobre</a>
      </nav>

      <div class="header-actions" id="user-nav-actions"></div>
    </div>
  </header>

  <!-- DETALHES DO PET -->
  <main class="container">
    <div style="margin-bottom: 1.5rem;">
      <a href="animais.html" style="color: var(--primary); font-weight: 600;">← Voltar para a lista</a>
    </div>

    <div class="details-layout">
      <!-- Imagem do Pet -->
      <div class="details-image-container">
        <img id="detalhe-foto" src="" alt="Foto do animal">
      </div>

      <!-- Informações -->
      <div class="details-info-card">
        <h1 id="detalhe-nome" style="font-size: 2.2rem; margin-bottom: 1rem; color: var(--text-main);">Carregando...</h1>

        <div class="details-spec-grid">
          <div class="spec-box">
            <span>Espécie</span>
            <strong id="detalhe-especie">-</strong>
          </div>
          <div class="spec-box">
            <span>Idade</span>
            <strong id="detalhe-idade">-</strong>
          </div>
          <div class="spec-box">
            <span>Porte</span>
            <strong id="detalhe-porte">-</strong>
          </div>
        </div>

        <div style="margin-bottom: 1.5rem;">
          <h3 style="margin-bottom: 0.5rem;">Sobre o animal:</h3>
          <p id="detalhe-descricao" style="color: var(--text-muted); line-height: 1.6;">-</p>
        </div>

        <button class="btn btn-primary" style="width: 100%;" onclick="alert('Interesse registrado! Em breve entraremos em contato.')">
          Quero Adotar este Pet ❤️
        </button>

        <!-- Botões de Editar e Excluir gerados pelo script.js -->
        <div id="acoes-dono"></div>
      </div>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="site-footer">
    <div class="footer-copy">
      © 2026 AdotePet - Trabalho Acadêmico de Engenharia de Software.
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', carregarDetalhes);
  </script>
</body>
</html>
