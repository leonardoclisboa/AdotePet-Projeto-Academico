<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdotePet - Detalhes do Animal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="logo">
        <div class="logo-badge">
          <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pets</span>
        </div>
        <div class="logo-text">Adote<span>Pet</span></div>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Início</a>
        <a href="animais.html" class="nav-link active">Animais</a>
        <a href="sobre.html" class="nav-link">Sobre</a>
      </nav>

      <div class="header-actions" id="user-nav-actions"></div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL: DETALHES DO ANIMAL -->
  <main class="container">
    <div style="margin-bottom: 1.5rem;">
      <a href="animais.html" style="color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 0.3rem;">
        <span class="material-symbols-outlined" style="font-size: 18px;">arrow_back</span>
        Voltar para a lista de animais
      </a>
    </div>

    <div class="details-layout">
      <!-- Imagem do Pet -->
      <div class="details-image-container">
        <img id="detalhe-foto" src="" alt="Carregando foto do animal...">
      </div>

      <!-- Informações e Especificações -->
      <div class="details-info-card">
        <div class="details-header">
          <div style="display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); background: var(--secondary-container); color: var(--on-secondary-container); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 0.75rem;">
            <span class="material-symbols-outlined" style="font-size: 16px;">verified</span>
            Disponível para Adoção
          </div>
          <h1 id="detalhe-nome" style="font-size: 2.4rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem;">
            Carregando...
          </h1>
        </div>

        <!-- Grade com Espécie, Idade e Porte -->
        <div class="details-spec-grid">
          <div class="spec-box">
            <span>Espécie</span>
            <strong id="detalhe-especie">-</strong>
          </div>
          <div class="spec-box">
            <span>Idade</span>
            <strong id="detalhe-idade">-</strong>
          </div>
          <div class="spec-box">
            <span>Porte</span>
            <strong id="detalhe-porte">-</strong>
          </div>
        </div>

        <!-- Descrição Completa -->
        <div style="margin-bottom: 2rem;">
          <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--text-main);">Sobre este amigo:</h3>
          <p id="detalhe-descricao" style="color: var(--text-muted); font-size: 1rem; line-height: 1.7; white-space: pre-line;">
            Carregando história e detalhes...
          </p>
        </div>

        <!-- Caixa do Responsável pelo Cadastro -->
        <div class="responsible-box">
          <span class="material-symbols-outlined" style="font-size: 28px; color: var(--primary);">person</span>
          <div>
            <p style="font-size: 0.8rem; text-transform: uppercase; font-weight: 600; color: var(--on-secondary-container);">Cadastrado por</p>
            <p id="detalhe-responsavel" style="font-weight: 700; color: var(--text-main);">-</p>
          </div>
        </div>

        <!-- Botão de Interesse na Adoção -->
        <button class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem;" onclick="solicitarAdocao()">
          <span class="material-symbols-outlined">favorite</span>
          Quero Adotar este Pet
        </button>

        <!-- Ações do Dono (Editar / Excluir) se for o autor logado -->
        <div id="acoes-dono"></div>
      </div>
    </div>
  </main>

  <!-- RODAPÉ -->
  <footer class="site-footer">
    <div class="footer-copy">
      © 2026 AdotePet - Trabalho Acadêmico de Engenharia de Software.
    </div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      carregarDetalhesAnimal();
    });

    function solicitarAdocao() {
      const nomePet = document.getElementById('detalhe-nome').textContent;
      alert(`Parabéns pelo interesse em adotar o(a) ${nomePet}!\n\nEm um cenário de produção, o sistema enviaria uma notificação ao responsável com seus dados para início da entrevista de adoção.`);
    }
  </script>
</body>
</html>
