<!-- Card Principal de Autenticação -->
<div class="w-full bg-surface-container-lowest rounded-lg shadow-xl p-gutter sm:p-space-xl relative overflow-hidden transition-all duration-300">
<!-- Efeito luminoso suave e orgânico superior -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-24 -left-24 w-48 h-48 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="relative z-10 flex flex-col items-center">
<!-- Emblema / Logotipo AdotePet -->
<div class="flex items-center gap-space-xs mb-space-lg group cursor-default">
<div class="w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center shadow-sm text-primary transition-transform duration-300 group-hover:scale-105">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">pets</span>
</div>
<div class="flex flex-col">
<span class="font-headline-md text-headline-md tracking-tight text-on-surface">
            Adote<span class="text-primary">Pet</span>
</span>
<span class="font-label-sm text-label-sm text-on-surface-variant -mt-1 tracking-wider uppercase">Plataforma Cidadã</span>
</div>
</div>
<!-- Título de Boas-Vindas -->
<div class="text-center mb-space-xl max-w-sm">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs">
          Bem-vindo de volta
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
          Acesse sua conta para continuar sua jornada de adoção e carinho.
        </p>
</div>
<!-- Formulário de Login -->
<form class="w-full space-y-space-lg" id="loginForm" onsubmit="event.preventDefault();">
<!-- Campo E-mail -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-md text-label-md text-on-surface flex items-center justify-between" for="email">
<span>E-mail</span>
<span class="text-on-surface-variant/60 font-body-sm text-[12px]">obrigatório</span>
</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/70 text-[20px] pointer-events-none">
              alternate_email
            </span>
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/50 font-body-md text-body-md pl-11 pr-4 py-3.5 rounded-DEFAULT outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#52b788] transition-all duration-200" id="email" name="email" placeholder="exemplo@email.com" required="" type="email"/>
</div>
</div>
<!-- Campo Senha -->
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="password">
              Senha
            </label>
<a class="font-label-sm text-label-sm text-primary hover:text-secondary transition-colors duration-150" href="#">
              Esqueceu a senha?
            </a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/70 text-[20px] pointer-events-none">
              lock
            </span>
<input class="w-full bg-surface-container-low text-on-surface placeholder:text-on-surface-variant/50 font-body-md text-body-md pl-11 pr-12 py-3.5 rounded-DEFAULT outline-none focus:bg-surface-container-lowest focus:shadow-[0_0_0_2px_#52b788] transition-all duration-200" id="password" name="password" placeholder="Digite sua senha" required="" type="password"/>
<button aria-label="Alternar visibilidade da senha" class="absolute right-3.5 p-1 rounded-full text-on-surface-variant/70 hover:text-on-surface hover:bg-surface-container transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px] block" id="toggleIcon">visibility</span>
</button>
</div>
</div>
<!-- Botão Principal de Login -->
<div class="pt-space-xs">
<button class="w-full bg-primary-container text-on-primary font-headline-sm text-title-md py-3.5 px-space-lg rounded-full shadow-md hover:bg-secondary transition-all duration-200 hover:shadow-lg active:scale-[0.99] flex items-center justify-center gap-space-xs cursor-pointer" type="submit">
<span>Entrar</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divisor Decorativo Sutil -->
<div class="w-full flex items-center my-space-lg gap-3">
<div class="h-px bg-surface-container-high flex-1"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant/60 uppercase tracking-widest">ou</span>
<div class="h-px bg-surface-container-high flex-1"></div>
</div>
<!-- Rodapé do Card: Chamada para Cadastro -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
          Ainda não tem uma conta? 
          <a class="font-label-md text-label-md text-primary hover:text-secondary font-semibold hover:underline decoration-primary underline-offset-4 ml-1 transition-all" href="#">
            Cadastre-se
          </a>
</p>
</div>
</div>
</div>
<!-- Navegação de Retorno Exterior ao Card -->
<div class="mt-space-lg text-center">
<a class="inline-flex items-center gap-space-xs font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-150 py-1 px-3 rounded-full hover:bg-surface-container" href="#">
<span class="material-symbols-outlined text-[18px]">west</span>
<span>Voltar para a página inicial</span>
</a>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.getElementById('togglePassword');
    const toggleIcon = document.getElementById('toggleIcon');

    if (toggleButton && passwordInput && toggleIcon) {
      toggleButton.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }
  })();
</script></main></body></html>
