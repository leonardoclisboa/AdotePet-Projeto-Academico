<!DOCTYPE html>

<html lang="pt-BR"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><title>AdotePet</title><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"tertiary-fixed-dim":"#d3c4b2","surface-container-highest":"#d9e3f9","on-background":"#121c2c","background":"#f9f9ff","outline":"#6e7a72","on-tertiary-fixed":"#221a0f","on-secondary":"#ffffff","inverse-primary":"#75daa8","on-surface-variant":"#3e4942","primary-fixed":"#92f7c3","surface-container-lowest":"#ffffff","on-primary-fixed-variant":"#005235","on-tertiary":"#ffffff","secondary-fixed":"#a0f4c8","error-container":"#ffdad6","surface-container-high":"#dee8ff","secondary-fixed-dim":"#85d7ad","secondary-container":"#a0f4c8","on-surface":"#121c2c","on-primary":"#ffffff","surface-container-low":"#f0f3ff","on-tertiary-fixed-variant":"#4f4537","inverse-on-surface":"#ebf1ff","outline-variant":"#bdcac0","on-error":"#ffffff","on-primary-container":"#00442c","error":"#ba1a1a","tertiary":"#675d4e","surface":"#f9f9ff","on-primary-fixed":"#002113","surface-tint":"#006c48","primary-container":"#52b788","on-error-container":"#93000a","primary-fixed-dim":"#75daa8","secondary":"#0e6c4a","surface-container":"#e7eeff","on-secondary-fixed":"#002113","surface-variant":"#d9e3f9","tertiary-fixed":"#efe0cd","on-secondary-container":"#19724f","surface-bright":"#f9f9ff","inverse-surface":"#273141","primary":"#006c48","surface-dim":"#d0daf0","on-secondary-fixed-variant":"#005236","tertiary-container":"#b0a392","on-tertiary-container":"#42392c"},borderRadius:{DEFAULT:"1rem",lg:"2rem",xl:"3rem",full:"9999px"},spacing:{"gutter-sm":"1rem","space-xl":"2.5rem","space-sm":"0.5rem","space-md":"1rem","margin-sm":"1.25rem","space-lg":"1.5rem",margin:"3rem","space-xs":"0.25rem",gutter:"1.5rem"},fontFamily:{"body-lg":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"display-mobile":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"title-md":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"],"body-sm":["Plus Jakarta Sans"],"headline-lg":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],display:["Plus Jakarta Sans"],"headline-sm":["Plus Jakarta Sans"]},fontSize:{"body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],"body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],"display-mobile":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"700"}],"headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],"label-md":["14px",{lineHeight:"20px",letterSpacing:"0.01em",fontWeight:"600"}],"title-md":["18px",{lineHeight:"24px",fontWeight:"600"}],"headline-lg-mobile":["24px",{lineHeight:"32px",fontWeight:"600"}],"body-sm":["14px",{lineHeight:"20px",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"40px",letterSpacing:"-0.01em",fontWeight:"600"}],"label-sm":["12px",{lineHeight:"16px",letterSpacing:"0.02em",fontWeight:"600"}],display:["48px",{lineHeight:"56px",letterSpacing:"-0.02em",fontWeight:"700"}],"headline-sm":["20px",{lineHeight:"28px",fontWeight:"600"}]}}}};</script></head><body class="bg-surface font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container min-h-screen flex items-center justify-center p-gutter"><main class="w-full max-w-lg"><div class="flex flex-col w-full">
<div class="relative w-full overflow-hidden rounded-lg bg-surface-container-lowest p-space-md sm:p-space-lg shadow-xl">
<div class="pointer-events-none absolute -right-16 -top-16 h-48 w-48 rounded-full bg-secondary-fixed opacity-40 blur-2xl"></div>
<div class="pointer-events-none absolute -left-12 bottom-10 h-36 w-36 rounded-full bg-surface-container-highest opacity-50 blur-xl"></div>
<div class="relative z-10 flex flex-col items-center text-center">
<div class="flex h-16 w-16 items-center justify-center rounded-full bg-surface-container-low shadow-sm transition-transform duration-300 hover:scale-105">
<span class="material-symbols-outlined text-primary" style="font-size: 32px; font-variation-settings: 'FILL' 1;">pets</span>
</div>
<div class="mt-space-xs flex items-center gap-1">
<span class="font-headline-sm text-headline-sm text-primary tracking-tight">Adote</span>
<span class="font-headline-sm text-headline-sm text-secondary-container bg-primary px-2 py-0.5 rounded-full text-surface-container-lowest tracking-tight">Pet</span>
</div>
<div class="mt-space-md">
<h1 class="font-headline-md text-headline-md text-on-surface">Crie sua conta no AdotePet</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-space-xs max-w-sm">
          Junte-se à nossa comunidade para adotar ou divulgar animais necessitados.
        </p>
</div>
</div>
<div class="relative z-10 mt-space-md flex items-center justify-between rounded-DEFAULT bg-surface-container-low p-space-sm px-space-md">
<div class="flex items-center gap-2">
<span class="flex h-6 w-6 items-center justify-center rounded-full bg-primary text-on-primary font-label-sm text-label-sm">1</span>
<span class="font-label-sm text-label-sm text-on-surface font-semibold">Dados Básicos</span>
</div>
<div class="h-1 flex-1 mx-3 rounded-full bg-secondary-fixed">
<div class="h-full w-1/2 rounded-full bg-primary"></div>
</div>
<div class="flex items-center gap-2 opacity-60">
<span class="flex h-6 w-6 items-center justify-center rounded-full bg-outline-variant text-on-surface-variant font-label-sm text-label-sm">2</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Preferências</span>
</div>
</div>
<form class="relative z-10 mt-space-md flex flex-col gap-space-sm" id="register-form" onsubmit="event.preventDefault(); validateForm();">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="fullname">
<span class="material-symbols-outlined text-outline text-base">person</span>
          Nome completo
        </label>
<div class="relative flex items-center">
<input class="w-full rounded-DEFAULT bg-surface-container-low px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-md" id="fullname" name="fullname" placeholder="Seu nome completo" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="email">
<span class="material-symbols-outlined text-outline text-base">mail</span>
          E-mail
        </label>
<div class="relative flex items-center">
<input class="w-full rounded-DEFAULT bg-surface-container-low px-4 py-3 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-md" id="email" name="email" placeholder="seu.email@exemplo.com" required="" type="email"/>
</div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-space-sm">
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="password">
<span class="material-symbols-outlined text-outline text-base">lock</span>
            Senha
          </label>
<div class="relative flex items-center">
<input class="w-full rounded-DEFAULT bg-surface-container-low px-4 py-3 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-md" id="password" minlength="8" name="password" placeholder="Mínimo de 8 caracteres" required="" type="password"/>
<button aria-label="Alternar visibilidade da senha" class="absolute right-3 flex items-center text-outline hover:text-on-surface focus:outline-none transition-colors" onclick="toggleVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface flex items-center gap-1.5" for="confirm-password">
<span class="material-symbols-outlined text-outline text-base">verified_user</span>
            Confirmar senha
          </label>
<div class="relative flex items-center">
<input class="w-full rounded-DEFAULT bg-surface-container-low px-4 py-3 pr-10 font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-all duration-200 focus:bg-surface-container-lowest focus:shadow-md" id="confirm-password" name="confirm-password" placeholder="Repita a senha digitada" required="" type="password"/>
<button aria-label="Alternar visibilidade de confirmação de senha" class="absolute right-3 flex items-center text-outline hover:text-on-surface focus:outline-none transition-colors" onclick="toggleVisibility('confirm-password', this)" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
</div>
<div class="mt-space-xs flex items-start gap-3 rounded-DEFAULT bg-surface-container-low/60 p-space-sm">
<div class="flex items-center pt-0.5">
<input class="h-5 w-5 rounded cursor-pointer accent-primary-container" id="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-body-sm text-on-surface select-none cursor-pointer" for="terms">
          Li e concordo com as orientações de <span class="font-label-sm text-label-sm text-primary font-bold hover:underline">Adoção Responsável</span> e políticas da plataforma.
        </label>
</div>
<div class="hidden rounded-DEFAULT p-space-sm font-label-md text-label-md text-center transition-all duration-300" id="feedback-message"></div>
<button class="mt-space-xs w-full rounded-full bg-primary-container py-3.5 px-6 font-label-md text-label-md text-on-primary-container shadow-sm transition-all duration-200 hover:bg-secondary-fixed hover:shadow-md active:scale-[0.99] flex items-center justify-center gap-2" id="submit-btn" type="submit">
<span>Cadastrar</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<div class="relative z-10 mt-space-md border-t border-transparent text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        Já tem uma conta? 
        <a class="font-label-md text-label-md text-primary font-bold transition-colors hover:text-secondary hover:underline inline-flex items-center gap-1 ml-1" href="#login">
<span>Entrar</span>
<span class="material-symbols-outlined text-base">login</span>
</a>
</p>
</div>
<div class="relative z-10 mt-space-md flex items-center justify-center gap-2 rounded-full bg-surface-container-low/40 py-2 px-4 text-center">
<span class="material-symbols-outlined text-secondary text-sm" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Mais de 1.400 vidas transformadas este mês</span>
</div>
</div>
</div>
<script>
  function toggleVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('span');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function validateForm() {
    const pass = document.getElementById('password').value;
    const confirm = document.getElementById('confirm-password').value;
    const feedback = document.getElementById('feedback-message');
    const submitBtn = document.getElementById('submit-btn');

    if (pass !== confirm) {
      feedback.textContent = 'As senhas não coincidem. Por favor, verifique.';
      feedback.className = 'rounded-DEFAULT p-space-sm font-label-md text-label-md text-center bg-error-container text-on-error-container block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span><span>Processando...</span>';

    setTimeout(() => {
      feedback.textContent = 'Conta criada com sucesso! Redirecionando...';
      feedback.className = 'rounded-DEFAULT p-space-sm font-label-md text-label-md text-center bg-secondary-fixed text-on-secondary-fixed block';
      submitBtn.innerHTML = '<span class="material-symbols-outlined text-lg">check_circle</span><span>Concluído</span>';
    }, 1200);
  }
</script></main></body></html>
